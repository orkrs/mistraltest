<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistral Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #e6e6e6;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    #app { width: 100%; max-width: 640px; display: flex; flex-direction: column; height: 80vh; }
    h1 { font-size: 1.25rem; margin-bottom: 1rem; color: #ffb86b; }
    #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.5rem; }
    .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 0.75rem; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #2b4a8b; }
    .assistant { align-self: flex-start; background: #23262f; }
    .error { align-self: flex-start; background: #5b2323; }
    form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    input {
      flex: 1; padding: 0.7rem 0.9rem; border-radius: 0.5rem;
      border: 1px solid #333; background: #171a21; color: #e6e6e6; font-size: 1rem;
    }
    button {
      padding: 0.7rem 1.2rem; border: none; border-radius: 0.5rem;
      background: #ffb86b; color: #0f1117; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Mistral Chat (mistral-small-latest)</h1>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" required />
      <button id="send" type="submit">Send</button>
    </form>
  </div>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      addMessage("user", text);
      history.push({ role: "user", content: text });
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Request failed");
        addMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        addMessage("error", err.message);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
